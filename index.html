<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Гармония Рациона</title>
    <meta name="description" content="Дневник питания, БЖУ, база продуктов, статистика и рецепты. Работает офлайн." />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Гармония Рациона" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Гармония Рациона" />
    <meta property="og:description" content="Дневник питания, БЖУ, база продуктов, статистика и рецепты. Работает офлайн." />
    <meta property="og:type" content="website" />
    
    <!-- Favicon — multiple formats for maximum browser support -->
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="./icons/icon.svg" />
    <link rel="shortcut icon" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <!-- Inline SVG favicon as data URI fallback -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A1A1A'/%3E%3Ccircle cx='32' cy='34' r='17' fill='none' stroke='%23FF6B6B' stroke-width='6' stroke-linecap='round' stroke-dasharray='88 107' transform='rotate(-90 32 34)'/%3E%3Cpath d='M32 22c-5 3-7 7-5 11 1 2.5 3.5 4 5 4s4-1.5 5-4c2-4 0-8-5-11z' fill='%234ECDC4'/%3E%3C/svg%3E" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: #E0E0E0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Pre-rendered content styles */
      .prerender-app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #121212;
        color: #E0E0E0;
      }
      .prerender-header {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 20px;
        border-bottom: 1px solid #2a2a2a;
      }
      .prerender-title-only {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .prerender-main {
        flex: 1;
        padding: 24px 20px;
        max-width: 800px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }
      .prerender-greeting {
        font-size: 14px;
        color: #888;
        margin: 0 0 4px;
      }
      .prerender-title {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 24px;
      }
      .prerender-card {
        background: #1e1e1e;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 16px;
      }
      .prerender-card-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 16px;
      }
      .prerender-calories {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .prerender-cal-value {
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .prerender-cal-label {
        font-size: 13px;
        color: #888;
      }
      .prerender-cal-ring {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 12px solid #2a2a2a;
        border-top-color: #4ade80;
        border-right-color: #4ade80;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        margin: 8px 0;
      }
      .prerender-macros {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .prerender-macro-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
      }
      .prerender-macro-label {
        color: #888;
      }
      .prerender-macro-bar {
        flex: 1;
        height: 8px;
        background: #2a2a2a;
        border-radius: 4px;
        margin: 0 12px;
        overflow: hidden;
      }
      .prerender-macro-fill {
        height: 100%;
        border-radius: 4px;
      }
      .prerender-nav {
        display: flex;
        justify-content: space-around;
        padding: 12px 16px;
        border-top: 1px solid #2a2a2a;
        background: #1a1a1a;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
      }
      .prerender-nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: #888;
        padding: 4px 12px;
      }
      .prerender-nav-item.active {
        color: #4ade80;
      }
      .prerender-nav-icon {
        width: 22px;
        height: 22px;
        opacity: 0.8;
      }
      .prerender-stats-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 16px;
      }
      .prerender-stat-box {
        background: #252525;
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }
      .prerender-stat-value {
        font-size: 18px;
        font-weight: 700;
      }
      .prerender-stat-label {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }
      .prerender-meals {
        margin-top: 16px;
      }
      .prerender-meal-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #2a2a2a;
      }
      .prerender-meal-item:last-child {
        border-bottom: none;
      }
      .prerender-meal-name {
        font-size: 14px;
        font-weight: 500;
      }
      .prerender-meal-kcal {
        font-size: 14px;
        color: #888;
      }
      @media (min-width: 640px) {
        .prerender-macros {
          grid-template-columns: 1fr 1fr 1fr;
        }
        .prerender-title {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Pre-rendered content for SSR/SEO — will be replaced by React on hydration -->
      <div class="prerender-app">
        <header class="prerender-header">
          <div class="prerender-title-only">Гармония Рациона</div>
        </header>

        <main class="prerender-main">
          <p class="prerender-greeting">Дневник питания</p>
          <h1 class="prerender-title">Добро пожаловать 👋</h1>

          <div class="prerender-card">
            <h2 class="prerender-card-title">Калории сегодня</h2>
            <div class="prerender-calories">
              <div class="prerender-cal-ring">
                <span class="prerender-cal-value">0</span>
                <span class="prerender-cal-label">потреблено ккал</span>
              </div>
              <div class="prerender-stats-row">
                <div class="prerender-stat-box">
                  <p class="prerender-stat-value" style="color: #f59e0b;">2000</p>
                  <p class="prerender-stat-label">норма</p>
                </div>
                <div class="prerender-stat-box">
                  <p class="prerender-stat-value" style="color: #2dd4bf;">0</p>
                  <p class="prerender-stat-label">сожжено</p>
                </div>
              </div>
            </div>
          </div>

          <div class="prerender-card">
            <h2 class="prerender-card-title">Белки, жиры, углеводы</h2>
            <div class="prerender-macros">
              <div class="prerender-macro-item">
                <span class="prerender-macro-label">Белки</span>
                <div class="prerender-macro-bar">
                  <div class="prerender-macro-fill" style="width: 0%; background: #2dd4bf;"></div>
                </div>
                <span>0 / 120 г</span>
              </div>
              <div class="prerender-macro-item">
                <span class="prerender-macro-label">Жиры</span>
                <div class="prerender-macro-bar">
                  <div class="prerender-macro-fill" style="width: 0%; background: #f59e0b;"></div>
                </div>
                <span>0 / 65 г</span>
              </div>
              <div class="prerender-macro-item">
                <span class="prerender-macro-label">Углеводы</span>
                <div class="prerender-macro-bar">
                  <div class="prerender-macro-fill" style="width: 0%; background: #a78bfa;"></div>
                </div>
                <span>0 / 250 г</span>
              </div>
            </div>
          </div>

          <div class="prerender-card">
            <h2 class="prerender-card-title">Приёмы пищи</h2>
            <div class="prerender-meals">
              <div class="prerender-meal-item">
                <span class="prerender-meal-name">🌅 Завтрак</span>
                <span class="prerender-meal-kcal">0 ккал</span>
              </div>
              <div class="prerender-meal-item">
                <span class="prerender-meal-name">☀️ Обед</span>
                <span class="prerender-meal-kcal">0 ккал</span>
              </div>
              <div class="prerender-meal-item">
                <span class="prerender-meal-name">🌙 Ужин</span>
                <span class="prerender-meal-kcal">0 ккал</span>
              </div>
              <div class="prerender-meal-item">
                <span class="prerender-meal-name">🍎 Перекусы</span>
                <span class="prerender-meal-kcal">0 ккал</span>
              </div>
            </div>
          </div>
        </main>

        <nav class="prerender-nav">
          <div class="prerender-nav-item active">
            <svg class="prerender-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Главная
          </div>
          <div class="prerender-nav-item">
            <svg class="prerender-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Дневник
          </div>
          <div class="prerender-nav-item">
            <svg class="prerender-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Статистика
          </div>
        </nav>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
